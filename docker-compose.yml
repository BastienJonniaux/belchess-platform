
services:
  db:
    image: postgres:16-alpine
    container_name: belchess_postgres
    restart: always
    environment:
      POSTGRES_USER: {{ POSTGRES_USER }}
      POSTGRES_PASSWORD: {{ POSTGRES_PASSWORD }}
      POSTGRES_DB: {{ POSTGRES_DB }}
    ports:
      - "5433:5432"
    volumes:
      - pg_data_v2:/var/lib/postgresql/data

volumes:
  pg_data_v2: